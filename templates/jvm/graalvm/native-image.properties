# lime-jvm GraalVM native-image baseline.
# Used when building with:  lime test jvm -final -graalvm
# JVMPlatform.deploy() copies this directory to <bin>/graalvm and feeds the *-config.json
# files to native-image. These args are appended too (safe defaults).
#
# SCOPE — this is the LIME-CORE baseline only:
#   jni-config.json    : the lime.jni.Lime bridge + the C++->Java upcall structs extracted
#                        from project/src/jni/*.cpp (CFFIPointer, CairoMatrix, GLActiveInfo,
#                        Vector2, Rectangle, haxe.root.Array, java.lang.Number).
#   reflect-config.json: genjvm entry points (ApplicationMain, Array). Minimal on purpose.
#   resource-config.json: manifest/assets/json globs.
#
# What is NOT here (by design — it is project-specific and must be added per project):
#   - Haxe closures invoked as native callbacks (CFFI_jni.cpp `invoke()V`)
#   - the text glyph struct (index/x/y) read during cairo glyph rendering
#   - dynamic Type.createInstance / Reflect usage in game code
#   - embedded assets unique to the project
# Generate those once with the tracing agent, then ship them in your project:
#   java -agentlib:native-image-agent=config-output-dir=META-INF/native-image -cp ... haxe.root.ApplicationMain
#
# OVERRIDE — drop your own jvm/graalvm/*.json via <template path="..."/> in project.xml;
# lime's templatePaths precedence makes the project copy win.

Args = --no-fallback \
       -H:+ReportExceptionStackTraces \
       --enable-url-protocols=http,https
